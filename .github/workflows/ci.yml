name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: make test

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      # A POSIX build script on Windows runs in MSYS2's MinGW shell, not Git's
      # bash. Git's bash puts Git's own mingw64\bin first on PATH, and a MinGW
      # compiler started from it can load Git's copies of zlib and zstd
      # instead of its own and exit without a word.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make
      - run: make test CC=gcc
